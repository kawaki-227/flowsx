name: FlowsX Android APK

run-name: APK ${{ inputs.app_name }} • ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nom de l’application"
        required: true
        type: string

      package_id:
        description: "Package Android"
        required: true
        type: string

      version:
        description: "Version x.y.z"
        required: true
        type: string

      source_type:
        description: "link, html ou zip"
        required: true
        type: string

      source_url:
        description: "URL de la source (site ou fichier temporaire)"
        required: true
        type: string

      internet:
        description: "Autoriser Internet"
        required: true
        type: string
        default: "true"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate inputs and prepare Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          APP_VERSION: ${{ inputs.version }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_URL: ${{ inputs.source_url }}
          INTERNET: ${{ inputs.internet }}
        run: |
          bash scripts/build-apk.sh

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "❌ APK introuvable"
            exit 1
          fi

          echo "✅ APK générée avec succès"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowsx-${{ inputs.package_id }}-${{ inputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
